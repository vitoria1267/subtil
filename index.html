<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Frente e Verso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Flashcards</h1>
    <div class="container">
        <!-- Flashcard 1 -->
        <div class="flashcard">
            <div class="card">
                <div class="frente">
                    <h2>Pergunta</h2>
                    <p>O que é HTML?</p>
                </div>
                <div class="verso">
                    <h2>Resposta</h2>
                    <p>
                        HTML é a linguagem responsável pela estrutura das páginas da Web.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
